<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L10 5 L0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#0A0A0F"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Arquitectura del Sistema — NeonHub</text>

  <!-- ── CAPA CLIENTE ── -->
  <text x="55" y="64" font-size="10" font-weight="700" fill="#06B6D4" letter-spacing="2">CAPA CLIENTE</text>
  <rect x="40" y="70" width="1120" height="92" rx="10" fill="#06B6D406" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Dashboard React -->
  <rect x="55" y="80" width="256" height="72" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="183" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Dashboard React 19</text>
  <text x="183" y="124" text-anchor="middle" font-size="10" fill="#94A3B8">Panel de Control · SPA · Vite</text>
  <text x="183" y="141" text-anchor="middle" font-size="9" fill="#06B6D4">puerto :3000</text>

  <!-- Landing Astro -->
  <rect x="331" y="80" width="256" height="72" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="459" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Landing Astro 5</text>
  <text x="459" y="124" text-anchor="middle" font-size="10" fill="#94A3B8">Web pública · SSR · Auth</text>
  <text x="459" y="141" text-anchor="middle" font-size="9" fill="#06B6D4">puerto :5000</text>

  <!-- Electron -->
  <rect x="607" y="80" width="256" height="72" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="735" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Electron Windows</text>
  <text x="735" y="124" text-anchor="middle" font-size="10" fill="#94A3B8">App escritorio · Auto-update</text>
  <text x="735" y="141" text-anchor="middle" font-size="9" fill="#06B6D4">x-tenant-id header</text>

  <!-- React Native -->
  <rect x="883" y="80" width="256" height="72" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="1011" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">React Native Móvil</text>
  <text x="1011" y="124" text-anchor="middle" font-size="10" fill="#94A3B8">iOS · Android · Expo</text>
  <text x="1011" y="141" text-anchor="middle" font-size="9" fill="#06B6D4">x-tenant-id header</text>

  <!-- Arrow client → backend -->
  <line x1="600" y1="162" x2="600" y2="198" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="474" y="170" width="252" height="18" rx="4" fill="#0A0A0F"/>
  <text x="600" y="183" text-anchor="middle" font-size="10" fill="#94A3B8">API REST / HTTPS · WebSocket (Socket.IO)</text>

  <!-- ── CAPA BACKEND ── -->
  <text x="55" y="220" font-size="10" font-weight="700" fill="#7C3AED" letter-spacing="2">CAPA BACKEND</text>
  <rect x="40" y="226" width="1120" height="198" rx="10" fill="#7C3AED06" stroke="#7C3AED" stroke-width="2"/>

  <text x="600" y="251" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Node.js 20 + Express 4</text>
  <text x="600" y="269" text-anchor="middle" font-size="10" fill="#94A3B8">251 endpoints · 25 módulos · JWT Auth · Rate Limiting · Aislamiento multi-tenant por subdomain / x-tenant-id</text>

  <!-- Module boxes: 7 boxes, w=138, gap=14, start x=58 -->
  <rect x="58"  y="284" width="138" height="56" rx="6" fill="#7C3AED18" stroke="#7C3AED60" stroke-width="1"/>
  <text x="127" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Auth</text>
  <text x="127" y="325" text-anchor="middle" font-size="9" fill="#94A3B8">JWT · Sesiones · RBAC</text>

  <rect x="210" y="284" width="138" height="56" rx="6" fill="#7C3AED18" stroke="#7C3AED60" stroke-width="1"/>
  <text x="279" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Tiendas</text>
  <text x="279" y="325" text-anchor="middle" font-size="9" fill="#94A3B8">Multi-tenant · Billing</text>

  <rect x="362" y="284" width="138" height="56" rx="6" fill="#7C3AED18" stroke="#7C3AED60" stroke-width="1"/>
  <text x="431" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Productos</text>
  <text x="431" y="325" text-anchor="middle" font-size="9" fill="#94A3B8">Catálogo · Stock · Galería</text>

  <rect x="514" y="284" width="138" height="56" rx="6" fill="#7C3AED18" stroke="#7C3AED60" stroke-width="1"/>
  <text x="583" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Pedidos</text>
  <text x="583" y="325" text-anchor="middle" font-size="9" fill="#94A3B8">Ciclo · Facturas PDF</text>

  <rect x="666" y="284" width="138" height="56" rx="6" fill="#7C3AED18" stroke="#7C3AED60" stroke-width="1"/>
  <text x="735" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Pagos</text>
  <text x="735" y="325" text-anchor="middle" font-size="9" fill="#94A3B8">Stripe · Webhooks HMAC</text>

  <rect x="818" y="284" width="138" height="56" rx="6" fill="#7C3AED18" stroke="#7C3AED60" stroke-width="1"/>
  <text x="887" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">n8n</text>
  <text x="887" y="325" text-anchor="middle" font-size="9" fill="#94A3B8">Automatizaciones · Email</text>

  <rect x="970" y="284" width="148" height="56" rx="6" fill="#7C3AED18" stroke="#7C3AED60" stroke-width="1"/>
  <text x="1044" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Socket.IO</text>
  <text x="1044" y="325" text-anchor="middle" font-size="9" fill="#94A3B8">Tiempo real · Notificaciones</text>

  <!-- Extra features row -->
  <text x="600" y="366" text-anchor="middle" font-size="9" fill="#F59E0B">⚡  Tickets · Certificaciones · Soporte · Audit Log · Sanitización · Helm · CORS · PM2 Cluster</text>
  <text x="600" y="382" text-anchor="middle" font-size="9" fill="#94A3B8">Módulos: auth · billing · products · orders · customers · gallery · tickets · certifications · reports · analytics · discounts…</text>
  <text x="600" y="398" text-anchor="middle" font-size="9" fill="#94A3B8">SSO Token · Deploy API · Admin Panel · SuperAdmin proxy · Role-level permissions (0–100)</text>

  <!-- Arrow backend → data -->
  <line x1="600" y1="424" x2="600" y2="462" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── CAPA DATOS ── -->
  <text x="55" y="482" font-size="10" font-weight="700" fill="#10B981" letter-spacing="2">CAPA DE DATOS</text>
  <rect x="40" y="489" width="1120" height="118" rx="10" fill="#10B98106" stroke="#10B981" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- PostgreSQL neonhub_db -->
  <rect x="55"  y="500" width="256" height="97" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="183" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">PostgreSQL</text>
  <text x="183" y="543" text-anchor="middle" font-size="11" fill="#10B981">neonhub_db</text>
  <text x="183" y="561" text-anchor="middle" font-size="9" fill="#94A3B8">Tiendas · Pedidos · Usuarios · Roles</text>
  <text x="183" y="578" text-anchor="middle" font-size="9" fill="#94A3B8">Docker · puerto :5433</text>

  <!-- PostgreSQL landing_db -->
  <rect x="331" y="500" width="256" height="97" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="459" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">PostgreSQL</text>
  <text x="459" y="543" text-anchor="middle" font-size="11" fill="#10B981">landing_db</text>
  <text x="459" y="561" text-anchor="middle" font-size="9" fill="#94A3B8">Usuarios web · Sesiones · Leads</text>
  <text x="459" y="578" text-anchor="middle" font-size="9" fill="#94A3B8">Docker · puerto :5434</text>

  <!-- Stripe -->
  <rect x="607" y="500" width="256" height="97" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="735" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Stripe</text>
  <text x="735" y="543" text-anchor="middle" font-size="11" fill="#F59E0B">Pagos · Suscripciones</text>
  <text x="735" y="561" text-anchor="middle" font-size="9" fill="#94A3B8">Webhooks firmados HMAC-SHA256</text>
  <text x="735" y="578" text-anchor="middle" font-size="9" fill="#94A3B8">API externa</text>

  <!-- n8n -->
  <rect x="883" y="500" width="256" height="97" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="1011" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">n8n Workflows</text>
  <text x="1011" y="543" text-anchor="middle" font-size="11" fill="#06B6D4">Automatizaciones</text>
  <text x="1011" y="561" text-anchor="middle" font-size="9" fill="#94A3B8">Email · Slack · Notificaciones</text>
  <text x="1011" y="578" text-anchor="middle" font-size="9" fill="#94A3B8">Docker · puerto :5678</text>

  <!-- Footer -->
  <text x="600" y="660" text-anchor="middle" font-size="10" fill="#374151">NeonHub — Trabajo Final de Grado Superior en Desarrollo de Aplicaciones Multiplataforma · 2025-2026</text>
</svg>
