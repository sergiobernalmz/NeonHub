name: neonhub

services:
  # ===========================================
  # PostgreSQL Database for NeonHub
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: neonhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neonhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_NEONHUB}
      POSTGRES_DB: neonhub_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neonhub -d neonhub_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

  # ===========================================
  # PostgreSQL Database for Landing Page
  # ===========================================
  postgres-landing:
    image: postgres:16-alpine
    container_name: neonhub-landing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: landing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_LANDING}
      POSTGRES_DB: landing_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - landing_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landing -d landing_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network


  # ===========================================
  # Backend API
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neonhub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3011
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: neonhub_db
      DB_USER: neonhub
      DB_PASSWORD: ${POSTGRES_PASSWORD_NEONHUB}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3011:3011"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - network

  # ===========================================
  # Frontend (Production Build)
  # ===========================================
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: neonhub-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:80"
  #   networks:
  #     - network

volumes:
  postgres_data:
    driver: local
  landing_postgres_data:
    driver: local

networks:
  network:
    driver: bridge
